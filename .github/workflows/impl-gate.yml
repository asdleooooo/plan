name: impl-gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impl-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Gate check
        env:
          HEAD_REF: ${{ github.head_ref }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Manual run; skipping strict gate."
            exit 0
          fi

          if [[ "${HEAD_REF}" != feat/* ]]; then
            echo "Not an implementation branch (${HEAD_REF}); gate passes."
            exit 0
          fi

          labels="$(jq -r 'map(.name) | join(",")' <<< "${LABELS_JSON}")"

          if ! echo ",${labels}," | grep -q ",plan-approved,"; then
            echo "impl-gate failed: missing label 'plan-approved'." >&2
            exit 2
          fi

          if ! echo ",${labels}," | grep -q ",code-approved,"; then
            echo "impl-gate failed: missing label 'code-approved'." >&2
            exit 2
          fi

          echo "impl-gate passed."
